name: Test

# Also runs on every push to master, so auto-version.yml can wait for it before
# releasing. auto-version.yml matches the job names.
on:
  pull_request:
    branches: [master, next]
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  test:
    name: Test on PostgreSQL ${{ matrix.pg_version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # pg_version: [14.1, 13.5, 12.9, 11.13, 10.19]
        pg_version: [17.2, 16.2] #, 15.6, 14.11, 13.13, 12.17, 11.22, 10.23]
    services:
      postgres:
        image: postgres:${{ matrix.pg_version }}
        env:
          POSTGRES_USER: runner
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: runner
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    # pyproject.toml's dev group installs schemainspect from ../schemainspect
    defaults:
      run:
        working-directory: migra

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          path: migra
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: cogna-public/schemainspect
          # Pinned like the actions; the dev group installs it from ../schemainspect
          ref: d4b7be5bfffd291e2f0a249360ce718a3fd98ae2 # v1.2.4
          path: schemainspect
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: 3.13

      # - name: Wait for Postgres
      #   run: until pg_isready -h localhost -U postgres -d app_db; do sleep 1; done
      
      - name: create postgres user
        run: psql postgresql://runner@localhost/runner -c 'create role postgres'

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client


      - name: Setup Poetry
        run: |
          python -m pip install -U pip setuptools poetry
          poetry config virtualenvs.create false

      - name: Install deps
        run: |
          python -m venv ~/.virt
          . ~/.virt/bin/activate
          poetry install

      - name: Lint
        run: |
          . ~/.virt/bin/activate
          make lint

      - name: Test
        run: |
          . ~/.virt/bin/activate
          make test
