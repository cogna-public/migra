[project]
name = "cogna-migra"
version = "1.1.2"
authors = [{ name = "Cogna Co", email = "info@cogna.co" }]
license = "Unlicense"
readme = "README.md"
description = "Like `diff` but for PostgreSQL schemas. Public fork for cogna changes."

[tool.poetry]
packages = [{ include = "migra" }]

[project.urls]
repository = "https://github.com/cogna-public/migra"
homepage = "https://github.com/cogna-public/migra"

[tool.poetry.dependencies]
python = ">=3.9,<4"
sqlbag = "*"
six = "*"
cogna-schemainspect = ">=1.2.2"
psycopg2-binary = { version=">=2.9.7,<3", optional = true }
greenlet = "^3.2.2"

[tool.poetry.group.dev.dependencies]
cogna-schemainspect = {path="../schemainspect", develop=true}
sqlbag = "*"
pytest = "*"
pytest-cov = "*"
pytest-clarity = "*"
psycopg2-binary = ">=2.9.7,<3"
flake8 = "*"
isort = "*"
black = "*"
toml = "*"
python-dotenv = "^1.1.0"

[tool.poetry.scripts]
migra = 'migra:do_command'

[tool.poetry.extras]
pg = ["psycopg2-binary"]

[tool.isort]
multi_line_output = 3
include_trailing_comma = true
line_length = 88

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
